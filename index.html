  if(refreshing||e.touches.length!==1||!atTop()||blocked()||e.target.closest('input,textarea,select,video,dialog,nav,.cropstage,[contenteditable]')){hide();return}
  let t=e.touches[0];gesture={x:t.clientX,y:t.clientY,id:t.identifier,ready:false};
 },{passive:true});
 window.addEventListener('touchmove',e=>{
  if(!gesture||refreshing)return;
  if(e.touches.length!==1||blocked()){hide();return}
  let t=e.touches[0];if(t.identifier!==gesture.id){hide();return}
  let state=pullDecision(t.clientX-gesture.x,t.clientY-gesture.y);
  if(state==='cancel'||(!atTop()&&!gesture.ready)){hide();return}
  if(state==='wait'){gesture.ready=false;indicator.classList.remove('ready');return;}
  if(e.cancelable)e.preventDefault();
  gesture.ready=state==='ready';indicator.classList.add('visible');indicator.classList.toggle('ready',gesture.ready);label.textContent=gesture.ready?'Suelta para actualizar':'Desliza para actualizar';
 },{passive:false});
 window.addEventListener('touchend',()=>{
  if(!gesture||refreshing)return;
  let ready=gesture.ready;hide();
  if(!ready||blocked())return;
  refreshApp();
 },{passive:true});
 window.addEventListener('touchcancel',()=>{if(!refreshing)hide()},{passive:true});
}
function restorePullView(){try{let raw=sessionStorage.getItem('firesport-refresh-view');if(!raw)return;sessionStorage.removeItem('firesport-refresh-view');let v=JSON.parse(raw);if(['Inicio','Clubes','Retos','Ligas','Perfil','Registrar','Autor'].includes(v.page))page=v.page;if(['Publicaciones','Físico','Rendimiento','Rutinas','Retos','Guardados','Creador'].includes(v.profileTab))profileTab=v.profileTab;if(data.clubs.some(c=>c.id===v.club))club=v.club;if(typeof v.viewAuthor==='string')viewAuthor=v.viewAuthor;if(typeof v.returnPage==='string')returnPage=v.returnPage;if(typeof v.scope==='string')scope=v.scope;if(typeof v.feed==='string')feed=v.feed}catch{}}
restorePullView();render();installPullRefresh();setInterval(strengthTick,1000);if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.filter(r=>r.scope.startsWith(new URL('./',location.href).href)).map(r=>r.unregister()))).catch(()=>{});if('caches' in window)caches.keys().then(ks=>Promise.all(ks.filter(k=>k.startsWith('firesport-')).map(k=>caches.delete(k)))).catch(()=>{});}
</script></body></html>

</style></head><body><header><strong>FIRE<em>SPORT</em></strong><span class="badge">🔥 DEMO LOCAL</span></header><main id="main"></main><nav id="nav"></nav><dialog id="modal"></dialog><div id="notice" role="status"></div><script>
const $=x=>document.querySelector(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>crypto.randomUUID?.()||String(Date.now()+Math.random()),fmt=x=>x.toLocaleString('es-ES');
const initial={name:'Tú',clubs:[{id:'club1',name:'Los Cuñados',code:'FIRE-DEMO',channels:['General','Retos diarios','Retos semanales','Retos mensuales','Castigos','Gaming','Deportes','Pruebas'],members:['Tú','Paco','Fran','Alba']}],challenges:[{id:'a',club:'club1',name:'Caminar 5 kilómetros',type:'Diario',proof:'GPS',xp:200,goal:5,status:'active'},{id:'b',club:'club1',name:'Estudiar una hora',type:'Diario',proof:'Cronómetro',xp:100,goal:60,status:'active'},{id:'c',club:'club1',name:'Perder al FIFA: 10 flexiones',type:'Castigo',proof:'Vídeo',xp:0,goal:0,status:'active'},{id:'d',club:'club1',name:'Recorrer 50 km',type:'Mensual',proof:'GPS',xp:500,goal:50,status:'active'}],posts:[],messages:[],routes:[]};
let data;try{data=JSON.parse(localStorage.getItem('firesport-v1'))||initial}catch{data=initial}let page='Inicio',club=data.clubs[0].id,channel='',filter='Todos',mode='Caminar',watch=null,running=false,paused=false,started=0,elapsed=0,points=[],km=0,linked=null,noticeTimer;const save=()=>localStorage.setItem('firesport-v1',JSON.stringify(data));const current=()=>data.clubs.find(c=>c.id===club);const xp=()=>data.challenges.filter(c=>c.club===club&&c.status==='done').reduce((a,c)=>a+c.xp,0);const notify=t=>{let n=$('#notice');n.textContent=t;n.style.display='block';clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>n.style.display='none',3500)};const btn=(t,a,cl='btn')=>'<button class="'+cl+'" data-action="'+esc(a)+'">'+esc(t)+'</button>';const stat=(n,v)=>'<div class="stat"><small>'+esc(n)+'</small><strong>'+esc(v)+'</strong></div>';
function card(c){return '<article class="card"><div class="row"><div class="tile">'+(c.type==='Castigo'?'🔥':c.proof==='GPS'?'🏃':'🎯')+'</div><div class="grow"><h3>'+esc(c.name)+'</h3><small>'+esc(c.type)+' · '+esc(c.proof)+' · '+({active:'Activo',pending:'Pendiente',done:'Completado'}[c.status])+'</small></div><strong class="badge">+'+c.xp+' XP</strong></div>'+(c.rules?'<p class="muted space" style="height:auto;margin-top:10px">'+esc(c.rules)+'</p>':'')+(c.deadline?'<p class="muted">Hasta '+esc(c.deadline)+'</p>':'')+'<div class="space"></div>'+(c.status==='active'?btn(c.type==='Castigo'?'Aceptar castigo':'Completar reto','proof:'+c.id,'soft wide'):c.status==='pending'?'<p class="muted">'+esc(c.evidence||'Prueba recibida')+'</p><div class="space"></div><div class="row">'+btn('Aprobar (demo)','approve:'+c.id)+btn('Rechazar','reject:'+c.id,'soft')+'</div>':'<span class="badge">✓ Validado en demo</span>')+'</article>'}
function render(){let c=current(),list=data.challenges.filter(x=>x.club===club),out='';if(page==='Inicio'){out='<small>TU VIDA · TU LIGA</small><h1>¡Enciende tu racha! 🔥</h1><div class="card hero"><small>EXPERIENCIA EN '+esc(c.name)+'</small><h1 style="font-size:48px;margin:12px 0">'+fmt(xp())+' <em>XP</em></h1><small>Nivel '+(1+Math.floor(xp()/1000))+'</small><div class="bar"><i style="width:'+(xp()%1000/10)+'%"></i></div></div><div class="grid">'+stat('Retos completados',list.filter(x=>x.status==='done').length)+stat('Retos pendientes',list.filter(x=>x.status==='active').length)+'</div><h2>Retos de hoy</h2>'+list.filter(x=>x.type==='Diario').map(card).join('')+'<h2>Muro del club</h2>'+data.posts.filter(p=>p.club===club).map(p=>'<div class="card"><strong>'+esc(p.author)+'</strong><p style="margin:9px 0">'+esc(p.text)+'</p><small>'+esc(p.date)+'</small></div>').join('')+'<div class="hint">Los datos de esta versión se guardan solo en tu navegador.</div>'}
if(page==='Clubes'){out='<div class="row between"><h1>Clubes</h1>'+btn('+ Crear','clubnew')+'</div><div class="tabs">'+data.clubs.map(x=>btn(x.name,'club:'+x.id,'soft '+(club===x.id?'active':''))).join('')+'</div><div class="card hero"><h1>'+esc(c.name)+'</h1><small>🔒 Club privado simulado · '+c.members.length+' miembros de ejemplo</small><div class="space"></div>'+btn('Invitar amigos','invite','btn wide')+'</div>';if(!channel){out+='<div class="row between"><h2>Canales</h2>'+btn('+ Canal','channelnew','soft')+'</div>'+c.channels.map(x=>'<div class="card row"><div class="tile">#</div><div class="grow"><strong>'+esc(x)+'</strong></div>'+btn('Abrir','channel:'+x,'soft')+'</div>').join('')}else{out+='<div class="row between"><h2># '+esc(channel)+'</h2>'+btn('Volver','back','soft')+'</div>';if(channel==='General'){out+=data.messages.filter(m=>m.club===club&&m.channel===channel).map(m=>'<div class="card"><strong>'+esc(m.name)+'</strong><p>'+esc(m.text)+'</p></div>').join('')+'<form id="chat"><input name="text" placeholder="Escribe un mensaje" required><div class="space"></div><button class="btn wide">Enviar</button></form>'}else{let map={'Retos diarios':'Diario','Retos semanales':'Semanal','Retos mensuales':'Mensual','Castigos':'Castigo'};out+=btn('+ Crear reto','new','btn wide')+list.filter(x=>channel==='Pruebas'?x.status==='pending':channel==='Deportes'?x.proof==='GPS':map[channel]?x.type===map[channel]:x.channel===channel).map(card).join('')}}}
if(page==='Retos'){out='<div class="row between"><h1>Retos</h1>'+btn('+ Crear','new')+'</div><div class="tabs">'+['Todos','Diario','Semanal','Mensual','Puntual','Castigo','Pruebas'].map(x=>btn(x,'filter:'+x,'soft '+(filter===x?'active':''))).join('')+'</div>'+list.filter(x=>filter==='Todos'||filter==='Pruebas'&&x.status==='pending'||x.type===filter).map(card).join('')}
if(page==='Registrar'){out='<h1>Registrar actividad</h1><div class="tabs">'+['Caminar','Correr','Bicicleta','Senderismo','Cronómetro'].map(x=>btn(x,'mode:'+x,'soft '+(mode===x?'active':''))).join('')+'</div><div id="route">'+routeSvg()+'</div><div class="grid" style="margin:12px 0">'+stat('Duración',clock(duration()))+stat('Distancia',km.toFixed(2)+' km')+stat('Velocidad media',duration()?(km*3600/duration()).toFixed(1)+' km/h':'0 km/h')+stat('Estado',running?(paused?'Pausa':'Grabando'):'Listo')+'</div>'+(running?'<div class="row">'+btn(paused?'Reanudar':'Pausar','pause','soft grow')+btn('Finalizar','stop','btn grow')+'</div>':btn('Iniciar actividad','start','btn wide'))+'<div class="hint">GPS real en navegador compatible y HTTPS, solo durante la actividad. Mapa esquemático, no cartografía real. No funciona de forma fiable en segundo plano.</div><h2>Historial</h2>'+data.routes.map(r=>'<div class="card"><strong>'+esc(r.mode)+'</strong><p class="muted">'+r.km.toFixed(2)+' km · '+clock(r.seconds)+' · '+esc(r.date)+'</p></div>').join('')}
if(page==='Ligas'){let rank=[{n:data.name,p:xp()},... (club==='club1'?[{n:'Paco',p:450},{n:'Fran',p:300},{n:'Alba',p:200}]:[])].sort((a,b)=>b.p-a.p);out='<small>CLASIFICACIÓN LOCAL DE EJEMPLO</small><h1>🏆 '+esc(c.name)+'</h1><div class="card hero"><small>PRIMERA POSICIÓN</small><h1>'+esc(rank[0].n)+'</h1><strong class="badge">'+rank[0].p+' XP</strong></div><div class="card">'+rank.map((p,i)=>'<div class="row line"><span>'+ (i+1)+'</span><div class="tile">'+esc(p.n[0])+'</div><strong class="grow">'+esc(p.n)+'</strong><span>'+p.p+' XP</span></div>').join('')+'</div>'}
if(page==='Perfil'){out='<h1>Mi perfil</h1><div class="card"><h2>'+esc(data.name)+'</h2>'+btn('Editar nombre','edit','soft')+'</div><div class="grid">'+stat('XP del club',xp())+stat('Clubes',data.clubs.length)+'</div><h2>Privacidad</h2><div class="card">Tus datos están en este dispositivo. Las invitaciones, los amigos y la aprobación de pruebas son simulaciones. No compartimos ubicación.</div>'+btn('Borrar datos de demo','reset','soft wide')}
$('#main').innerHTML=out;$('#nav').innerHTML=[['Inicio','⌂'],['Clubes','♧'],['Retos','◎'],['Registrar','⌖'],['Ligas','🏆'],['Perfil','☺']].map(([n,i])=>'<button data-action="page:'+n+'" class="'+(page===n?'active':'')+'"><span>'+i+'</span>'+n+'</button>').join('')}
function dialog(title,body){$('#modal').innerHTML='<div class="row between"><h2 style="margin:0">'+esc(title)+'</h2>'+btn('✕','close','soft')+'</div>'+body;$('#modal').showModal()}
const fields=(n,t)=>'<label>'+esc(n)+'</label>'+t;
const form=(name,body,action='Guardar')=>'<form id="'+name+'">'+body+'<div class="space"></div><button class="btn wide">'+action+'</button></form>';
function clock(t){return [Math.floor(t/3600),Math.floor(t%3600/60),t%60].map(x=>String(x).padStart(2,'0')).join(':')}
function duration(){return Math.floor((elapsed+(running&&!paused?Date.now()-started:0))/1000)}
function routeSvg(){let p='';if(points.length){let ys=points.map(x=>x[0]),xs=points.map(x=>x[1]),a=Math.min(...xs),b=Math.max(...xs),c=Math.min(...ys),d=Math.max(...ys);p=points.map((v,i)=>(i?'L':'M')+(20+280*(v[1]-a)/Math.max(b-a,0.00001))+' '+(170-140*(v[0]-c)/Math.max(d-c,0.00001))).join(' ')}return '<svg viewBox="0 0 320 195"><path d="M0 50L320 105M40 0L95 195M180 0L220 195M0 160L320 20" stroke="#435048" stroke-width="2" fill="none"/><path d="'+p+'" fill="none" stroke="#ff7544" stroke-width="4"/><text x="12" y="18" fill="#b9c0bb" font-size="10">TRAZADO GPS ESQUEMÁTICO</text>'+(p?'':'<text x="160" y="100" text-anchor="middle" fill="#b9c0bb" font-size="12">Tu recorrido aparecerá aquí</text>')+'</svg>'}
function unwatch(){if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null}}
function beginWatch(){if(mode==='Cronómetro')return;if(!navigator.geolocation){notify('GPS no disponible');running=false;return}watch=navigator.geolocation.watchPosition(p=>{if(!running||paused||p.coords.accuracy>50)return;let v=[p.coords.latitude,p.coords.longitude],l=points.at(-1);if(l){let r=Math.PI/180,a=Math.sin((v[0]-l[0])*r/2)**2+Math.cos(l[0]*r)*Math.cos(v[0]*r)*Math.sin((v[1]-l[1])*r/2)**2;let delta=12742*Math.asin(Math.min(1,Math.sqrt(a)));if(delta<.005)return;km+=delta}points.push(v)},()=>{unwatch();running=false;notify('GPS no disponible o permiso denegado');render()},{enableHighAccuracy:true,maximumAge:0,timeout:15000})}
setInterval(()=>{if(running&&page==='Registrar'&&!$('#modal').open)render()},1000);
document.addEventListener('click',async e=>{let b=e.target.closest('[data-action]');if(!b)return;let [a,...rest]=b.dataset.action.split(':'),v=rest.join(':');if(a==='close'){$('#modal').close();return}if(a==='page'){page=v;channel=''}else if(a==='club'){club=v;channel=''}else if(a==='channel'){channel=v}else if(a==='back'){channel=''}else if(a==='filter'){filter=v}else if(a==='clubnew'){dialog('Crear club privado',form('clubform',fields('Nombre','<input name="name" required maxlength="60">'),'Crear'));return}else if(a==='channelnew'){dialog('Crear canal',form('channelform',fields('Nombre','<input name="name" required maxlength="60">'),'Crear'));return}else if(a==='invite'){dialog('Invitar amigos','<div class="card"><strong>'+esc(current().code)+'</strong></div><p class="muted">Código de demostración, aún no conecta dispositivos.</p>');return}else if(a==='new'){dialog('Crear reto',form('challengeform',fields('Nombre','<input name="name" required maxlength="100">')+fields('Tipo','<select name="type">'+['Diario','Semanal','Mensual','Puntual','Castigo'].map(t=>'<option>'+t+'</option>').join('')+'</select>')+fields('Reglas','<textarea name="rules" placeholder="Acuerdo voluntario y seguro"></textarea>')+fields('Prueba','<select name="proof">'+['Fotografía','Vídeo','GPS','Cronómetro','Votación','Manual'].map(t=>'<option>'+t+'</option>').join('')+'</select>')+fields('Meta numérica (km o minutos si procede)','<input type="number" name="goal" min="0" value="0" step="0.1">')+fields('XP','<input type="number" name="xp" min="0" max="10000" value="100" required>')+fields('Fecha límite','<input name="deadline" type="date">'),'Publicar reto'));return}else if(a==='proof'){let c=data.challenges.find(x=>x.id===v);linked=v;dialog(c.name,(c.type==='Castigo'?'<div class="hint">Solo si aceptas voluntariamente y puedes realizarlo de forma segura. Puedes rechazarlo o acordar una alternativa.</div>':'')+(['GPS','Cronómetro'].includes(c.proof)?btn('Registrar actividad','linkroute:'+v,'btn wide'):'')+form('proofform',fields('Descripción de la prueba','<textarea name="evidence" required></textarea>')+fields('Adjuntar foto o vídeo (solo vista previa local)','<input name="file" type="file" accept="image/*,video/*"><div id="preview"></div>'),'Enviar para validar'));return}else if(a==='linkroute'){let c=data.challenges.find(x=>x.id===v);linked=v;mode=c.proof==='Cronómetro'?'Cronómetro':'Caminar';page='Registrar';$('#modal').close()}else if(a==='approve'||a==='reject'){let c=data.challenges.find(x=>x.id===v);if(c.status==='pending'){c.status=a==='approve'?'done':'active';if(a==='approve')data.posts.unshift({club:c.club,author:data.name,text:'Reto completado: '+c.name,date:new Date().toLocaleDateString('es-ES')});notify(a==='approve'?'Prueba aprobada localmente':'Prueba rechazada')}}else if(a==='mode'&&!running){mode=v}else if(a==='start'&&!running){running=true;paused=false;started=Date.now();elapsed=0;km=0;points=[];beginWatch()}else if(a==='pause'&&running){if(paused){paused=false;started=Date.now();beginWatch()}else{elapsed+=Date.now()-started;paused=true;unwatch()}}else if(a==='stop'&&running){let seconds=duration();unwatch();running=false;paused=false;data.routes.unshift({mode,km,seconds,date:new Date().toLocaleDateString('es-ES')});if(linked){let c=data.challenges.find(x=>x.id===linked);if(c&&c.status==='active'&&((c.proof==='GPS'&&mode!=='Cronómetro'&&points.length>1&&km>=c.goal)||(c.proof==='Cronómetro'&&seconds>=c.goal*60))){c.status='pending';c.evidence=km.toFixed(2)+' km · '+clock(seconds)}linked=null}notify('Actividad guardada localmente')}else if(a==='edit'){dialog('Editar perfil',form('profileform',fields('Nombre','<input name="name" required value="'+esc(data.name)+'">')));return}else if(a==='reset'){if(confirm('¿Borrar todos los datos locales?')){unwatch();localStorage.removeItem('firesport-v1');location.reload()}return}save();render()});
document.addEventListener('change',e=>{if(e.target.name==='file'){let f=e.target.files[0],preview=$('#preview');if(!f||!preview)return;let el=document.createElement(f.type.startsWith('video/')?'video':'img');el.src=URL.createObjectURL(f);el.controls=true;preview.replaceChildren(el)}});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,d=new FormData(f),n=String(d.get('name')||'').trim();if(f.id==='clubform'&&n){let c={id:id(),name:n,code:'FIRE-'+id().slice(0,8),channels:['General','Retos diarios','Retos semanales','Retos mensuales','Castigos','Pruebas'],members:[data.name]};data.clubs.push(c);club=c.id;channel=''}else if(f.id==='channelform'&&n){if(!current().channels.includes(n))current().channels.push(n)}else if(f.id==='challengeform'&&n){data.challenges.unshift({id:id(),club,channel,name:n,type:d.get('type'),proof:d.get('proof'),xp:Number(d.get('xp')),goal:Number(d.get('goal')),rules:d.get('rules'),deadline:d.get('deadline'),status:'active'});page='Retos';filter='Todos'}else if(f.id==='proofform'){let c=data.challenges.find(x=>x.id===linked);if(c&&c.status==='active'){c.status='pending';c.evidence=d.get('evidence')+(d.get('file')?.size?' · Archivo seleccionado (no almacenado)':'')}linked=null;notify('Prueba pendiente de validación')}else if(f.id==='chat'){data.messages.push({club,channel,name:data.name,text:d.get('text')})}else if(f.id==='profileform'&&n){data.name=n}if($('#modal').open)$('#modal').close();save();render()});render();

function beginWatch(){if(mode==='Cronómetro')return;if(!navigator.geolocation){notify('GPS no disponible');running=false;return}watch=navigator.geolocation.watchPosition(p=>{if(!running||paused||p.coords.accuracy>50)return;let v=[p.coords.latitude,p.coords.longitude],l=points.at(-1);if(l&&!segmentStart){let r=Math.PI/180,a=Math.sin((v[0]-l[0])*r/2)**2+Math.cos(l[0]*r)*Math.cos(v[0]*r)*Math.sin((v[1]-l[1])*r/2)**2;let delta=12742*Math.asin(Math.min(1,Math.sqrt(a)));if(delta<.005)return;km+=delta}segmentStart=false;points.push(v)},()=>{unwatch();running=false;notify('GPS no disponible o permiso denegado');render()},{enableHighAccuracy:true,maximumAge:0,timeout:15000})}

mpletedAt:null});notify('Reto copiado')}}else if(a==='settings'){dialog('Ajustes del clan',form('settingsform','<div class="card"><b>Roles del clan</b><p class="muted">Fundador: gestión completa · Administrador: gestión de retos · Moderador: revisión de pruebas · Miembro: participación. Permisos multiusuario pendientes de servidor.</p></div>'+fields('Quién puede crear retos','<select name="creators"><option'+(current().settings?.creators==='Todos'?' selected':'')+'>Todos</option><option'+(current().settings?.creators==='Administradores'?' selected':'')+'>Administradores</option></select>')+fields('Nombre','<input name="name" required value="'+esc(current().name)+'">')));return}else if(a==='publish'||a==='clanpublish'){dialog('Nueva publicación',form('publishform','<input type="hidden" name="destination" value="'+esc(a==='clanpublish'?club:'global')+'">'+fields('Descripción','<textarea name="text" required></textarea>')+fields('Reto asociado','<select name="key"><option value="">Sin reto</option>'+catalog.map(t=>'<option value="'+t.key+'">'+esc(t.name)+'</option>').join('')+'</select>')+fields('Foto o vídeo','<input name="file" type="file" accept="image/*,video/*" required><div id="preview"></div>'),'Publicar localmente'));return}else if(a==='close'){$('#modal').close();linked=null;return}if(a==='page'){page=v;channel=''}else if(a==='club'){club=v;channel=''}else if(a==='channel'){channel=v}else if(a==='back'){channel=''}else if(a==='filter'){filter=v}else if(a==='clubnew'){dialog('Crear clan privado',form('clubform',fields('Nombre','<input name="name" required maxlength="60">'),'Crear'));return}else if(a==='channelnew'){dialog('Crear canal',form('channelform',fields('Nombre','<input name="name" required maxlength="60">'),'Crear'));return}else if(a==='invite'){dialog('Invitar amigos','<div class="card"><strong>'+esc(current().code)+'</strong></div><p class="muted">Las invitaciones aún no conectan dispositivos.</p>');return}else if(a==='new'){dialog('Crear reto',form('challengeform',fields('Nombre','<input name="name" required maxlength="100">')+fields('Tipo','<select name="type">'+['Diario','Semanal','Mensual','Puntual','Castigo'].map(t=>'<option>'+t+'</option>').join('')+'</select>')+fields('Reglas','<textarea name="rules" placeholder="Acuerdo voluntario y seguro"></textarea>')+fields('Prueba','<select name="proof">'+['Fotografía','Vídeo','GPS','Cronómetro'].map(t=>'<option>'+t+'</option>').join('')+'</select>')+fields('Meta numérica (km o minutos si procede)','<input type="number" name="goal" min="0" value="0" step="0.1">')+fields('XP','<input type="number" name="xp" min="0" max="10000" value="100" required>')+fields('Fecha límite','<input name="deadline" type="date">'),'Publicar reto'));return}else if(a==='proof'){let c=data.challenges.find(x=>x.id===v);let today=new Date();let day=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');if(c.start&&day<c.start||c.deadline&&day>c.deadline){notify('Reto fuera de las fechas programadas');return}linked=v;dialog(c.name,(c.type==='Castigo'?'<div class="hint">Solo si aceptas voluntariamente y puedes realizarlo de forma segura. Puedes rechazarlo o acordar una alternativa.</div>':'')+(['GPS','Cronómetro'].includes(c.proof)?btn('Registrar actividad','linkroute:'+v,'btn wide'):'')+form('proofform',fields('Descripción de la prueba','<textarea name="evidence" required></textarea>')+fields('Adjuntar prueba (almacenamiento local)','<input name="file" type="file" accept="image/*,video/*"><div id="preview"></div>'),'Enviar para validar'));return}else if(a==='linkroute'){let c=data.challenges.find(x=>x.id===v);linked=v;mode=c.proof==='Cronómetro'?'Cronómetro':c.sport==='Ciclismo'?'Bicicleta':c.sport==='Running'?'Correr':'Caminar';page='Registrar';$('#modal').close()}else if(a==='approve'||a==='reject'){let c=data.challenges.find(x=>x.id===v);if(c.status==='pending'){c.status=a==='approve'?'done':'active';if(a==='approve')c.completedAt document.addEventListener('change',e=>{if(e.target.id==='levelSelect'){level=e.target.value;render();return}if(e.target.id==='sportSelect'){sport=e.target.value;render();return}if(e.target.id==='clanSelect'){club=e.target.value;channel='';render();return}if(e.target.name==='file'){let f=e.target.files[0],preview=$('#preview');if(!f||!preview)return;let el=document.createElement(f.type.startsWith('video/')?'video':'img');el.src=URL.createObjectURL(f);el.controls=true;preview.replaceChildren(el)}});

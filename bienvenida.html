<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Firesport · Bienvenida</title><style>*{box-sizing:border-box}body{margin:0;background:#101114;color:#f5f5f6;font:16px system-ui}main{max-width:440px;margin:auto;padding:32px 20px}h1{font-size:34px;font-style:italic}em{color:#ff7544}label{display:block;margin:14px 0 5px}input:not([type=checkbox]),select{width:100%;padding:12px;border:1px solid #45464d;background:#24262c;color:white;border-radius:10px;font:inherit}button,a.button{display:block;width:100%;padding:13px;margin:12px 0;border:0;border-radius:10px;background:#ff7544;color:#171311;font-weight:bold;text-align:center;text-decoration:none;font-size:16px}button.secondary,a.secondary{background:#30323a;color:white}small,p{color:#b5b5bd}section{background:#1c1e24;border:1px solid #35363e;border-radius:16px;padding:18px}button:disabled{opacity:.5}progress{width:100%;accent-color:#ff7544}</style></head><body><main><h1>FIRE<em>SPORT</em></h1><p>Tu deporte. Tu comunidad.</p><section id="screen"></section><p id="status" role="status"></p><a class="button secondary" href="./index.html">Volver a la versión local</a></main><script>
const screen=document.querySelector('#screen'),status=document.querySelector('#status');let mode='register',step=0;const answers={};const sports=['Atletismo','Baloncesto','Balonmano','Béisbol','Boxeo','Calistenia','Ciclismo','Escalada','Fútbol','Gimnasio','Golf','Natación','Pádel','Pilates','Running','Senderismo','Tenis','Voleibol','Yoga','Otros'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const questions=[['age','¿Qué edad tienes?','<input name="answer" type="number" min="18" max="120" placeholder="Edad (años)">'],['weight','¿Cuál es tu peso?','<input name="answer" type="number" min="1" max="700" step="0.1" placeholder="kg">'],['height','¿Cuánto mides?','<input name="answer" type="number" min="20" max="300" step="0.1" placeholder="cm">'],['sport','¿Cuál es tu deporte favorito?','<select name="answer"><option value="">Seleccionar</option>'+sports.map(x=>'<option>'+x+'</option>').join('')+'</select>'],['hobby','¿Qué aficiones tienes?','<input name="answer" maxlength="200" placeholder="Tus hobbies">'],['frequency','¿Con qué frecuencia practicas deporte?','<select name="answer"><option value="">Seleccionar</option><option>Actualmente no practico</option><option>1-2 días por semana</option><option>3-4 días por semana</option><option>5 o más días por semana</option></select>'],['streak','¿Quieres recibir recordatorios para mantener tu racha?','<select name="answer"><option value="no">No, gracias</option><option value="yes">Sí, recordatorios opcionales</option></select>']];
function auth(){screen.innerHTML='<h2>'+(mode==='register'?'Crear cuenta':'Iniciar sesión')+'</h2><form id="auth">'+(mode==='register'?'<label>Usuario</label><input name="username" autocomplete="username" minlength="3" maxlength="30" required pattern="[a-zA-Z0-9_]+">':'')+'<label>Correo electrónico</label><input name="email" type="email" autocomplete="email" required><label>Contraseña</label><input name="password" type="password" autocomplete="'+(mode==='register'?'new-password':'current-password')+'" minlength="8" required><button disabled>Servicio de cuentas pendiente</button></form><small>Vista previa: no envíes credenciales reales. El servidor de autenticación aún no está conectado.</small><button class="secondary" id="toggle">'+(mode==='register'?'Ya tengo cuenta':'Crear cuenta')+'</button><button class="secondary" id="preview">Ver cuestionario de bienvenida</button>';screen.querySelector('#auth').onsubmit=e=>e.preventDefault();screen.querySelector('#toggle').onclick=()=>{mode=mode==='register'?'login':'register';auth()};screen.querySelector('#preview').onclick=()=>{step=0;quiz()}}
function quiz(){let q=questions[step];screen.innerHTML='<small>Pregunta '+(step+1)+' de '+questions.length+'</small><progress value="'+(step+1)+'" max="'+questions.length+'"></progress><h2>'+q[1]+'</h2><form id="question">'+q[2]+'<button>Continuar</button></form><button id="skip" class="secondary">Omitir</button>'+(step?'<button id="back" class="secondary">Anterior</button>':'')+'<small>Vista previa. No se guardan las respuestas ni se envían a ningún servidor. Los recordatorios respetarán los días de descanso.</small>';let f=screen.querySelector('#question');if(answers[q[0]]!=null)f.elements.answer.value=answers[q[0]];f.onsubmit=e=>{e.preventDefault();answers[q[0]]=f.elements.answer.value;advance()};screen.querySelector('#skip').onclick=()=>{delete answers[q[0]];advance()};let b=screen.querySelector('#back');if(b)b.onclick=()=>{step--;quiz()}}
function advance(){if(++step<questions.length){quiz();return}screen.innerHTML='<h2>¡Todo listo!</h2><p>Has terminado la vista previa del cuestionario. Las cuentas reales y las notificaciones están pendientes de conexión.</p><button id="restart">Volver al inicio</button>';screen.querySelector('#restart').onclick=()=>{for(let k of Object.keys(answers))delete answers[k];auth()}}auth();
</script></body></html>
